<div class="container mt-4">
<div class="d-flex justify-content-between align-items-center mb-3">
<button class="btn btn-secondary"
        [routerLink]="['/']">
  Dashboard
</button>

  <h2 class="m-0">{{capital(entity)}}</h2>

</div>
<h2>{{capital(entity)}}</h2>

<button class="btn btn-success mb-3"
[routerLink]="['/form',entity]">

Add

</button>

<button class="reload-btn" (click)="reloadPage()">
 Reload
</button>


<table class="table table-striped">

<thead>

<tr>

<th *ngFor="let f of fields">{{capital(f)}}</th>

<th>actions</th>

</tr>

</thead>

<tbody *ngIf="page?.content">

<tr *ngFor="let r of page?.content">

<td *ngFor="let f of fields">
  <ng-container *ngIf="isISODate(r[f]); else normal">
    {{ fmtdate(getdate(r[f])) }}
  </ng-container>
  <ng-template #normal>
    {{ r[f] }}
  </ng-template>
</td>
<td>
<button class="btn btn-primary btn-sm"
[routerLink]="['/form',entity,r.id]">
Edit
</button>

<button class="btn btn-danger btn-sm"
(click)="delete(r.id)">
Delete
</button>
</td>

</tr>

</tbody>

</table>

</div>
